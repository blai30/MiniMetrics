name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH, no leading v), e.g. 1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve version
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid version '$version'. Expected MAJOR.MINOR.PATCH (tag like v1.2.0)."
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Releasing version $version"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test gate
        run: dotnet test --configuration Release --no-restore

      - name: Publish default (framework-dependent) folder
        run: >
          dotnet publish MiniMetrics.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:Version=$env:VERSION
          -o publish/fd-folder

      - name: Publish self-contained folder
        run: >
          dotnet publish MiniMetrics.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=$env:VERSION
          -o publish/sc-folder

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      # Default download: framework-dependent. No --channel is passed, so it uses Velopack's built-in
      # default channel (win), which is what the feed files (releases.win.json, the nupkg, RELEASES-win)
      # are named after. No --framework is declared, so the installer never downloads or installs the .NET
      # runtime; if it is missing, the .NET apphost points the user to the runtime download on first launch.
      - name: Pack Velopack default channel
        run: >
          vpk pack
          --packId MiniMetrics
          --packVersion $env:VERSION
          --packDir publish/fd-folder
          --mainExe MiniMetrics.exe
          --packTitle MiniMetrics
          --packAuthors "Brian Lai"
          --icon Assets/minimetrics.ico
          --outputDir velopack/default

      - name: Pack Velopack selfcontained channel
        run: >
          vpk pack
          --packId MiniMetrics
          --packVersion $env:VERSION
          --packDir publish/sc-folder
          --mainExe MiniMetrics.exe
          --packTitle MiniMetrics
          --packAuthors "Brian Lai"
          --icon Assets/minimetrics.ico
          --channel selfcontained
          --outputDir velopack/sc

      # Give the bootstrappers friendly names. The default (framework-dependent) Setup and Portable are
      # unqualified; the self-contained ones keep the selfcontained marker. Only the standalone Setup.exe
      # and Portable.zip are renamed; the .nupkg and releases.*.json feed files are left untouched because
      # the in-app updater fetches them by their exact names.
      - name: Name release assets
        run: |
          function Set-AssetName($dir, $filter, $target) {
            $file = Get-ChildItem $dir -Filter $filter | Select-Object -First 1
            if ($file -and $file.Name -ne $target) {
              Rename-Item -Path $file.FullName -NewName $target
            }
          }
          Set-AssetName velopack/default "*Setup.exe"   "MiniMetrics-Setup.exe"
          Set-AssetName velopack/default "*Portable.zip" "MiniMetrics-Portable.zip"
          Set-AssetName velopack/sc "*Setup.exe"   "MiniMetrics-Setup-selfcontained.exe"
          Set-AssetName velopack/sc "*Portable.zip" "MiniMetrics-Portable-selfcontained.zip"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -Path velopack/default, velopack/sc -File | ForEach-Object { $_.FullName }
          gh release create "v$env:VERSION" `
            --draft `
            --generate-notes `
            --target $env:GITHUB_SHA `
            --title "v$env:VERSION" `
            @assets
