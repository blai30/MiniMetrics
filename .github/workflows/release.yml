name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (MAJOR.MINOR.PATCH, no leading v), e.g. 1.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Resolve version
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Error "Invalid version '$version'. Expected MAJOR.MINOR.PATCH (tag like v1.2.0)."
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Releasing version $version"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Test gate
        run: dotnet test --configuration Release --no-restore

      - name: Publish self-contained single-file
        run: >
          dotnet publish MiniMetrics.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION
          -o publish/sc-singlefile

      - name: Publish self-contained folder
        run: >
          dotnet publish MiniMetrics.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=$env:VERSION
          -o publish/sc-folder

      - name: Publish framework-dependent single-file
        run: >
          dotnet publish MiniMetrics.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:VERSION
          -o publish/fd-singlefile

      - name: Publish framework-dependent folder
        run: >
          dotnet publish MiniMetrics.csproj -c Release -r win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -p:Version=$env:VERSION
          -o publish/fd-folder

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Pack Velopack self-contained channel
        run: >
          vpk pack
          --packId MiniMetrics
          --packVersion $env:VERSION
          --packDir publish/sc-folder
          --mainExe MiniMetrics.exe
          --packTitle MiniMetrics
          --packAuthors "Brian Lai"
          --icon Assets/minimetrics.ico
          --channel sc
          --outputDir velopack/sc

      - name: Pack Velopack framework-dependent channel
        run: >
          vpk pack
          --packId MiniMetrics
          --packVersion $env:VERSION
          --packDir publish/fd-folder
          --mainExe MiniMetrics.exe
          --packTitle MiniMetrics
          --packAuthors "Brian Lai"
          --icon Assets/minimetrics.ico
          --channel fd
          --outputDir velopack/fd

      - name: Package artifacts
        run: |
          Copy-Item publish/sc-singlefile/MiniMetrics.exe "MiniMetrics-v$env:VERSION-selfcontained.exe"
          Copy-Item publish/fd-singlefile/MiniMetrics.exe "MiniMetrics-v$env:VERSION.exe"
          Compress-Archive -Path (Get-ChildItem publish/sc-folder -Exclude *.pdb) -DestinationPath "MiniMetrics-v$env:VERSION-selfcontained.zip" -Force
          Compress-Archive -Path (Get-ChildItem publish/fd-folder -Exclude *.pdb) -DestinationPath "MiniMetrics-v$env:VERSION.zip" -Force
          Compress-Archive -Path (Get-ChildItem publish/sc-folder -Filter *.pdb)  -DestinationPath "MiniMetrics-v$env:VERSION-debug-symbols.zip" -Force

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $velopackAssets = Get-ChildItem -Path velopack/sc, velopack/fd -File | ForEach-Object { $_.FullName }
          gh release create "v$env:VERSION" `
            --draft `
            --generate-notes `
            --target $env:GITHUB_SHA `
            --title "v$env:VERSION" `
            "MiniMetrics-v$env:VERSION-selfcontained.exe" `
            "MiniMetrics-v$env:VERSION-selfcontained.zip" `
            "MiniMetrics-v$env:VERSION.exe" `
            "MiniMetrics-v$env:VERSION.zip" `
            "MiniMetrics-v$env:VERSION-debug-symbols.zip" `
            @velopackAssets
